name: Feature request
description: Propose a new capability
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Which question or task is hard to do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Live view (map, timeline, agents)
        - Claude Code session
        - Local agents (Ollama)
        - Infrastructure (Docker, ports, GPU)
        - MCP & Skills
        - Git & checkpoints
        - Error console
        - Telemetry
        - Other
