name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - name: Sanitized fixtures contain no secrets or personal data
        run: node scripts/fixtures/sanitize.mjs --check
      - run: pnpm build
      - name: Electron is within the last 2 supported majors
        run: node scripts/check-electron-support.mjs
      - name: E2E (Playwright _electron, security checklist)
        run: pnpm e2e
      - name: Packaged app (electron-builder --dir) and Electron Fuses
        run: pnpm e2e:packaged
      - name: Upload Playwright results on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: apps/desktop/test-results/
          retention-days: 7
      - name: Dependency audit
        run: pnpm audit --audit-level high

  secrets:
    name: Secret scan (gitleaks, full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The CLI is used instead of gitleaks-action: the action only scans the pushed range
      # and fails on the repository's first push (see docs/memoria/PROBLEMI_NOTI.md).
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.24.3
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Scan full history
        run: gitleaks git --redact --verbose --no-banner .

  commits:
    name: Conventional commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}

  memoria:
    name: Project memory updated
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Warn when a feature PR has no STORIA.md entry
        shell: bash
        run: |
          base=${{ github.event.pull_request.base.sha }}
          head=${{ github.event.pull_request.head.sha }}
          if git log --format=%s "$base..$head" | grep -qE '^feat(\(|:|!)'; then
            if ! git diff --name-only "$base" "$head" | grep -q '^docs/memoria/STORIA.md$'; then
              echo "::warning title=Memoria::This PR adds features but docs/memoria/STORIA.md was not updated (run the fine-sessione skill)."
            fi
          fi
